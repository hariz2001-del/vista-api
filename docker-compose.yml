services:
  db:
    image: postgres:16-alpine
    container_name: vista-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vista
      POSTGRES_PASSWORD: vista_local_dev
      POSTGRES_DB: vista
      # Deterministic collation, so ORDER BY does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # Bound to loopback only. In production this port is never exposed off the box.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vista -d vista"]
      interval: 5s
      timeout: 5s
      retries: 10
