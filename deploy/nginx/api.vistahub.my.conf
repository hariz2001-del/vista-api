# api.vistahub.my
#
# Visitors reach Cloudflare over HTTPS; Cloudflare re-encrypts to this origin
# using the Cloudflare Origin Certificate (Cloudflare SSL mode: Full (strict)).
# The AWS security group admits 443 from Cloudflare's IP ranges only, which is
# what makes the CF-Connecting-IP header trustworthy for the guessing limits.
#
# Install:
#   sudo cp deploy/nginx/api.vistahub.my.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.vistahub.my.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vistahub.my;

    ssl_certificate     /etc/ssl/cloudflare/api.vistahub.my.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.vistahub.my.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Orders are small JSON bodies. Nothing legitimate comes close to this.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 30s;
    }
}

# Nothing is served on plain HTTP. Cloudflare only ever connects on 443, and the
# default site should be removed: sudo rm /etc/nginx/sites-enabled/default
